<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pepper-Soup Docs</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    try {
      document.documentElement.dataset.theme = localStorage.getItem('theme') ||
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hl-light">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hl-dark" disabled>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="header">
    <button class="icon-btn mobile" id="menu-btn" aria-label="Menu">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <a class="brand" href="#">Pepper-Soup</a>

    <div class="switch" id="source-switch">
      <button data-source="gitbook">GitBook</button>
      <button data-source="confluence">Confluence</button>
    </div>
    <nav class="tabs" id="space-tabs">
      <button data-space="user">User Guide</button>
      <button data-space="developer">Developer Reference</button>
    </nav>

    <button class="search-btn" id="search-btn">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span>Search</span>
      <kbd>Ctrl K</kbd>
    </button>

    <div class="dropdown">
      <button class="icon-btn" id="download-btn" title="Download">
        <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      </button>
      <div class="menu" id="download-menu"></div>
    </div>
    <button class="icon-btn" id="theme-btn" title="Theme">
      <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <input class="filter" id="filter" type="text" placeholder="Filter pages" autocomplete="off">
      <nav id="nav"></nav>
    </aside>
    <div class="backdrop" id="backdrop"></div>

    <main class="main">
      <div class="page" id="page">
        <div class="page-bar">
          <div class="crumbs" id="crumbs"></div>
          <div class="page-actions">
            <button class="btn" id="edit-btn">
              <svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg> Edit
            </button>
          </div>
        </div>
        <article class="prose" id="content"></article>
        <nav class="pager" id="pager"></nav>
      </div>

      <section class="editor" id="editor" hidden>
        <div class="editor-bar">
          <span class="editor-path" id="editor-path"></span>
          <div class="editor-actions">
            <button class="btn" id="cancel-btn">Cancel</button>
            <button class="btn primary" id="save-btn">Save</button>
          </div>
        </div>
        <div class="editor-body">
          <textarea id="editor-input" spellcheck="false"></textarea>
          <div class="prose editor-preview" id="editor-preview"></div>
        </div>
      </section>
    </main>

    <aside class="toc" id="toc">
      <div class="toc-title">On this page</div>
      <ul id="toc-list"></ul>
    </aside>
  </div>

  <div class="modal" id="search-modal" hidden>
    <div class="search-box">
      <input id="search-input" type="text" placeholder="Search docs" autocomplete="off">
      <div id="search-results"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.0/mermaid.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
