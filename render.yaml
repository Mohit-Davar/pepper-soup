services:
  - type: web
    name: doc-site
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/manifest
    envVars:
      - key: GITHUB_TOKEN
        sync: false
      - key: EDIT_PASSWORD
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: GITHUB_BRANCH
        sync: false
