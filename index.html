<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documentation</title>
  
  <!-- Standard typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Highlight.js for code syntax -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hljs-theme">
  
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body data-mode="gitbook">

  <!-- Main Shell -->
  <div class="shell">
    
    <!-- Top Global Header -->
    <header class="app-header">
      
      <!-- Left: Mobile Toggle + Workspace Switcher Dropdown (ERPNext/GitBook style) -->
      <div class="header-left">
        <button id="mobile-toggle-btn" class="btn-icon mobile-only" aria-label="Toggle Navigation">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>

        <!-- Platform / Format Switcher (GitBook Experience vs Confluence Experience) -->
        <div class="space-selector-wrap" id="space-selector-wrap">
          <button class="space-selector-btn" id="space-selector-btn">
            <span class="space-icon" id="current-space-icon">📖</span>
            <div class="space-text-wrap">
              <span class="space-name" id="current-space-name">GitBook Docs</span>
              <span class="space-sub" id="current-space-format">GitBook Format & Style</span>
            </div>
            <svg class="chevron-down" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>

          <!-- Dropdown Menu -->
          <div class="space-dropdown-menu" id="space-dropdown-menu">
            <div class="dropdown-group-header">Documentation Engine</div>
            <button class="dropdown-item active" data-platform="gitbook">
              <span class="item-icon">📘</span>
              <div class="item-info">
                <span class="item-title">GitBook</span>
                <span class="item-desc">GitBook markdown files with native GitBook styling</span>
              </div>
            </button>
            <button class="dropdown-item" data-platform="confluence">
              <span class="item-icon">📑</span>
              <div class="item-info">
                <span class="item-title">Confluence Wiki</span>
                <span class="item-desc">Confluence markdown files with native Atlassian styling</span>
              </div>
            </button>
          </div>
        </div>
      </div>

      <!-- Center: Search Bar (GitBook / Atlassian standard) -->
      <div class="header-center">
        <div class="search-input-box" id="search-trigger">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <span class="search-placeholder">Search docs across spaces...</span>
          <kbd class="search-kbd">Ctrl K</kbd>
        </div>
      </div>

      <!-- Right: Subspace switcher (User Guide vs Developer Reference) + Theme Toggle -->
      <div class="header-right">
        <!-- Subspace Tab Switcher -->
        <div class="subspace-toggle-bar" id="subspace-toggle-bar">
          <button class="subspace-tab-btn active" data-sub="user">User Guide</button>
          <button class="subspace-tab-btn" data-sub="developer">Developer Reference</button>
        </div>

        <button id="theme-toggle" class="btn-icon" title="Toggle color scheme">
          <svg id="theme-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
          </svg>
        </button>
      </div>

    </header>

    <!-- App Body Layout -->
    <div class="app-body">
      
      <!-- Left Sidebar: Directory Tree -->
      <aside class="sidebar" id="sidebar">
        
        <!-- Sidebar Search/Filter -->
        <div class="sidebar-filter-row">
          <div class="sidebar-search-field">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="sidebar-filter" placeholder="Filter pages..." autocomplete="off">
          </div>
        </div>

        <!-- Navigation Tree Items -->
        <nav class="nav-tree" id="nav-tree">
          <!-- Injected dynamically -->
        </nav>
      </aside>

      <!-- Center Reading Area -->
      <main class="reading-pane" id="reading-pane">
        
        <div class="article-wrapper">
          
          <!-- Confluence-specific Page Banner (rendered only when in confluence skin) -->
          <div class="confluence-page-header" id="confluence-header" style="display: none;">
            <div class="confluence-space-breadcrumb" id="confluence-space-crumb">
              <span class="crumb-icon">🏢</span>
              <span class="crumb-space-name">Spaces</span> / <span class="crumb-current-space">User Guide</span>
            </div>
            <div class="confluence-meta-row">
              <div class="confluence-author-info">
                <div class="avatar-placeholder">U</div>
                <div class="author-details">
                  <span class="author-name">Documentation Workspace</span>
                  <span class="modified-time">Current verified release</span>
                </div>
              </div>
              <div class="confluence-actions">
                <button class="confluence-btn" id="confluence-copy-link-btn">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
                  Share
                </button>
              </div>
            </div>
          </div>

          <!-- GitBook Breadcrumbs (rendered when in gitbook skin) -->
          <div class="gitbook-breadcrumbs" id="gitbook-breadcrumbs">
            <!-- Injected dynamically -->
          </div>

          <!-- Article Content -->
          <article class="doc-content markdown-body" id="doc-content">
            <!-- Content loaded via markdown -->
          </article>

          <!-- GitBook Bottom Pagination -->
          <div class="pagination-footer" id="pagination-footer">
            <!-- Injected dynamically -->
          </div>

        </div>

        <!-- Right Side: In-Page Table of Contents -->
        <aside class="on-this-page" id="on-this-page">
          <div class="toc-fixed-box">
            <div class="toc-heading">ON THIS PAGE</div>
            <ul class="toc-links" id="toc-links">
              <!-- Injected dynamically -->
            </ul>
          </div>
        </aside>

      </main>

    </div>

  </div>

  <!-- Search Modal Dialog -->
  <div class="search-modal-backdrop" id="search-modal">
    <div class="search-modal-panel">
      <div class="search-header-bar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="modal-search-input" placeholder="Type to search documentation..." autofocus>
        <button id="close-search-btn" class="btn-icon" aria-label="Close search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="search-results-box" id="search-results-box">
        <div class="search-empty-prompt">Search across all 4 documentation spaces...</div>
      </div>
    </div>
  </div>

  <!-- Markdown & Diagram Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.0/mermaid.min.js"></script>

  <!-- Pre-bundled Documentation Data (Allows direct double-clicking file:// without CORS errors) -->
  <script src="data/data.js"></script>

  <script src="assets/app.js"></script>
</body>
</html>
