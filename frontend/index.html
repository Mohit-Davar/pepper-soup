<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Pepper-Soup Docs</title>
  <meta name="description" content="Pepper-Soup user guide and developer reference.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    try {
      document.documentElement.dataset.theme = localStorage.getItem('theme') ||
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch (e) { document.documentElement.dataset.theme = 'light'; }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hl-light">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hl-dark" disabled>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="header">
    <button class="icon-btn mobile-only" id="menu-btn" aria-label="Open navigation">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <a class="brand" href="#/" aria-label="Pepper-Soup documentation home">
      <span class="brand-mark" aria-hidden="true">P</span>
      <span class="brand-name">Pepper-Soup <span class="brand-sub">Docs</span></span>
    </a>

    <div class="header-nav">
      <div class="switch" id="source-switch" role="tablist" aria-label="Output">
        <button data-source="gitbook" role="tab">GitBook</button>
        <button data-source="confluence" role="tab">Confluence</button>
      </div>
      <nav class="tabs" id="space-tabs" aria-label="Space">
        <button data-space="user"><span class="full">User Guide</span><span class="short">User</span></button>
        <button data-space="developer"><span class="full">Developer Reference</span><span class="short">Developer</span></button>
      </nav>
    </div>

    <button class="search-btn" id="search-btn" aria-label="Search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span>Search docs</span>
      <kbd>Ctrl K</kbd>
    </button>

    <div class="mode" id="mode-switch" role="group" aria-label="View mode">
      <button data-mode="reader" title="See the docs as readers do">
        <svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
        <span>Reader</span>
      </button>
      <button data-mode="review" title="See review items and fix the text">
        <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <span>Review</span>
      </button>
    </div>

    <a class="btn review-link review-only" id="review-link" href="#/review">
      <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      <span>Issues</span><b id="open-count">0</b>
    </a>

    <div class="dropdown">
      <button class="icon-btn" id="more-btn" aria-label="More options" aria-haspopup="menu">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg>
      </button>
      <div class="menu" id="more-menu" role="menu"></div>
    </div>
  </header>

  <div class="layout" id="layout">
    <aside class="sidebar" id="sidebar" aria-label="Pages">
      <div class="sidebar-top">
        <input class="filter" id="filter" type="search" placeholder="Filter pages" autocomplete="off" aria-label="Filter pages">
      </div>
      <nav id="nav"></nav>
    </aside>
    <div class="backdrop" id="backdrop"></div>

    <main class="main" id="main">
      <div class="page" id="page">
        <div class="page-bar">
          <div class="crumbs" id="crumbs"></div>
          <div class="page-actions">
            <span class="page-issues review-only" id="page-issues" hidden></span>
            <button class="btn review-only" id="edit-btn">
              <svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
              <span>Edit page</span>
            </button>
          </div>
        </div>
        <div class="doc" id="doc">
          <article class="prose" id="content"></article>
          <aside class="rail" id="rail" aria-label="Review items"></aside>
        </div>
        <nav class="pager" id="pager"></nav>
      </div>

      <section class="dashboard" id="dashboard" hidden></section>

      <section class="editor" id="editor" hidden>
        <div class="editor-bar">
          <div class="editor-title">
            <span class="editor-label">Editing</span>
            <span class="editor-path" id="editor-path"></span>
          </div>
          <div class="editor-tabs mobile-only" id="editor-tabs">
            <button data-pane="write" class="active">Write</button>
            <button data-pane="preview">Preview</button>
          </div>
          <div class="editor-actions">
            <button class="btn" id="cancel-btn">Cancel</button>
            <button class="btn primary" id="save-btn">Save</button>
          </div>
        </div>
        <div class="editor-body" id="editor-body">
          <textarea id="editor-input" spellcheck="false" aria-label="Markdown"></textarea>
          <div class="prose editor-preview" id="editor-preview"></div>
        </div>
      </section>
    </main>

    <aside class="toc" id="toc" aria-label="On this page">
      <div class="toc-title">On this page</div>
      <ul id="toc-list"></ul>
    </aside>
  </div>

  <button class="threads-fab review-only" id="threads-fab" hidden>
    <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"/></svg>
    <span id="threads-fab-count">0</span>
  </button>

  <!-- bottom sheet (phones and tablets) -->
  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <section class="sheet" id="sheet" hidden aria-label="Review items">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <strong id="sheet-title">Review</strong>
      <button class="icon-btn" id="sheet-close" aria-label="Close">
        <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </section>

  <!-- search -->
  <div class="modal" id="search-modal" hidden>
    <div class="search-box" role="dialog" aria-label="Search">
      <div class="search-field">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search-input" type="text" placeholder="Search all docs" autocomplete="off">
        <kbd>Esc</kbd>
      </div>
      <div id="search-results"></div>
    </div>
  </div>

  <!-- sign in -->
  <div class="modal center" id="signin-modal" hidden>
    <form class="dialog" id="signin-form" role="dialog" aria-labelledby="signin-title">
      <h2 id="signin-title">Sign in to review</h2>
      <p class="muted">Review mode shows the open review items on each page, where each sentence comes from, and lets you fix the text.</p>
      <label>Your name
        <input id="signin-name" type="text" maxlength="60" autocomplete="name" placeholder="Recorded with your changes" required>
      </label>
      <label>Review password
        <input id="signin-password" type="password" autocomplete="current-password" required>
      </label>
      <p class="form-error" id="signin-error" hidden></p>
      <div class="dialog-actions">
        <button type="button" class="btn" id="signin-cancel">Cancel</button>
        <button type="submit" class="btn primary" id="signin-submit">Sign in</button>
      </div>
    </form>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.0/mermaid.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
