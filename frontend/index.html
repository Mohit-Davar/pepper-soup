<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Pepper-Soup Docs</title>
  <meta name="description" content="Pepper-Soup user guide and developer reference.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    try {
      document.documentElement.dataset.theme = localStorage.getItem('theme') ||
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch (e) { document.documentElement.dataset.theme = 'light'; }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hl-light">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hl-dark" disabled>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="header">
    <button class="icon-btn mobile-only" id="menu-btn" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>

    <a class="brand" href="#/" aria-label="Pepper-Soup documentation home">
      <img class="brand-mark" src="/favicon.svg" alt="" width="24" height="24" aria-hidden="true">
      <span class="brand-name">Pepper-Soup</span>
      <span class="brand-sub">Docs</span>
    </a>

    <nav class="tabs" id="space-tabs" aria-label="Documentation spaces">
      <button type="button" data-space="user"><span class="full">User Guide</span><span class="short">User</span></button>
      <button type="button" data-space="developer"><span class="full">Developer Reference</span><span class="short">Developer</span></button>
      <span class="tabs-indicator" id="tabs-indicator" aria-hidden="true"></span>
    </nav>

    <div class="header-actions">
      <div class="mode header-mode" id="mode-switch" role="group" aria-label="View mode">
        <button type="button" data-mode="reader" title="See the docs as readers do">Reader</button>
        <button type="button" data-mode="review" title="See review items and fix the text">Review</button>
      </div>

      <button class="issues-btn review-only" id="issues-btn" type="button" aria-expanded="false" aria-controls="issues-drawer">
        <span>Issues</span>
        <span class="issues-count" id="open-count">0</span>
      </button>

      <button class="search-btn" id="search-btn" type="button" aria-label="Search documentation">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span class="search-label">Search</span>
        <kbd id="search-kbd">Ctrl K</kbd>
      </button>

      <button class="icon-btn" id="theme-btn" type="button" aria-label="Switch theme" title="Toggle light or dark theme">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>

      <div class="dropdown">
        <button class="icon-btn more-btn" id="more-btn" type="button" aria-label="View options and tools" aria-haspopup="menu" aria-expanded="false" aria-controls="more-menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
          <span class="more-dot" id="more-dot" hidden aria-hidden="true"></span>
        </button>
        <div class="menu" id="more-menu" role="menu" aria-label="View options and tools">
          <div class="menu-section">
            <div class="menu-label">Output</div>
            <div class="switch menu-switch" id="source-switch" role="tablist" aria-label="Output format">
              <button type="button" data-source="gitbook" role="tab" aria-selected="true">GitBook</button>
              <button type="button" data-source="confluence" role="tab" aria-selected="false">Confluence</button>
            </div>
          </div>

          <div class="menu-section">
            <div class="menu-label">Edit tools</div>
            <button class="menu-item changes-btn" id="changes-btn" type="button" role="menuitemcheckbox" aria-checked="false" aria-pressed="false" title="Show what was edited since the pipeline generated the docs">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M6 8.5V15a3 3 0 0 0 3 3h6.5M18 15.5V9a3 3 0 0 0-3-3H8.5"/></svg>
              <span>Show changes</span>
              <b class="menu-badge" id="changes-count">0</b>
            </button>
          </div>

          <div id="more-dynamic"></div>
        </div>
      </div>
    </div>
  </header>

  <div class="layout" id="layout">
    <aside class="sidebar" id="sidebar" aria-label="Pages">
      <nav id="nav"></nav>
    </aside>
    <div class="backdrop" id="backdrop"></div>

    <main class="main" id="main">
      <div class="page" id="page">
        <div class="page-bar">
          <div class="crumbs" id="crumbs"></div>
          <div class="page-actions">
            <span class="page-issues review-only" id="page-issues" hidden></span>
            <button class="btn sm review-only" id="edit-btn" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
              <span>Edit page</span>
            </button>
          </div>
        </div>
        <div class="doc" id="doc">
          <article class="prose" id="content"></article>
        </div>
        <nav class="pager" id="pager" aria-label="Page navigation"></nav>
      </div>

      <section class="editor" id="editor" hidden aria-label="Page editor">
        <div class="editor-bar">
          <div class="editor-title">
            <span class="editor-path" id="editor-path"></span>
            <span class="editor-dirty" id="editor-dirty" hidden>Unsaved changes</span>
          </div>

          <div class="editor-toolbar" id="editor-toolbar" role="toolbar" aria-label="Formatting">
            <button type="button" data-fmt="heading" title="Heading (H2)" aria-label="Insert heading">H2</button>
            <button type="button" data-fmt="bold" title="Bold" aria-label="Bold text"><strong>B</strong></button>
            <button type="button" data-fmt="list" title="Bullet list" aria-label="Insert bullet list">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
            </button>
            <button type="button" data-fmt="link" title="Link" aria-label="Insert link">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            </button>
            <button type="button" data-fmt="table" title="Markdown table" aria-label="Insert table">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16M15 4v16"/></svg>
            </button>
          </div>

          <div class="editor-view-tabs" id="editor-tabs" role="tablist" aria-label="Editor layout">
            <button type="button" data-pane="split" role="tab" aria-selected="true" class="active">Split</button>
            <button type="button" data-pane="write" role="tab" aria-selected="false">Editor</button>
            <button type="button" data-pane="preview" role="tab" aria-selected="false">Preview</button>
          </div>

          <div class="editor-actions">
            <button type="button" class="btn sm" id="cancel-btn">Cancel</button>
            <button type="button" class="btn sm primary" id="save-btn" disabled title="Save (Cmd/Ctrl + S)">Save</button>
          </div>
        </div>
        <div class="editor-body" id="editor-body" data-pane="split">
          <textarea id="editor-input" wrap="soft" spellcheck="true" aria-label="Markdown editor"></textarea>
          <div class="prose editor-preview" id="editor-preview"></div>
        </div>
      </section>
    </main>

    <aside class="toc" id="toc" aria-label="On this page">
      <div class="toc-title">On this page</div>
      <ul id="toc-list"></ul>
    </aside>
  </div>

  <!-- Anchored margin issue popover -->
  <div class="issue-popover" id="issue-popover" role="dialog" aria-label="Review issue" hidden></div>

  <!-- Right-side Issues drawer -->
  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="issues-drawer" id="issues-drawer" role="dialog" aria-modal="true" aria-label="Review issues" hidden>
    <div class="drawer-head">
      <div class="drawer-title-row">
        <h2>Issues</h2>
        <span class="drawer-summary" id="drawer-summary"></span>
      </div>
      <button type="button" class="icon-btn" id="drawer-close" aria-label="Close issues drawer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="drawer-filters">
      <input type="search" id="dash-q" placeholder="Filter by page, text, or id..." aria-label="Filter issues">
      <div class="drawer-filter-row">
        <select id="dash-space" aria-label="Filter by space">
          <option value="all">All pages</option>
          <option value="current">Current page</option>
          <option value="user">User Guide</option>
          <option value="developer">Developer Reference</option>
        </select>
        <select id="dash-kind" aria-label="Filter by type"></select>
        <select id="dash-status" aria-label="Filter by status">
          <option value="open">Open</option>
          <option value="resolved">Resolved</option>
          <option value="ignored">Won't fix</option>
          <option value="all">All statuses</option>
        </select>
      </div>
    </div>
    <div class="drawer-body" id="dash-list"></div>
  </aside>

  <!-- search command palette -->
  <div class="modal" id="search-modal" hidden>
    <div class="search-box" role="dialog" aria-modal="true" aria-label="Search documentation">
      <div class="search-field">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search-input" type="text" placeholder="Search documentation..." autocomplete="off">
        <kbd>Esc</kbd>
      </div>
      <div id="search-results"></div>
    </div>
  </div>

  <!-- diagram lightbox -->
  <div class="modal lightbox-modal" id="lightbox-modal" hidden>
    <div class="lightbox-box" role="dialog" aria-modal="true" aria-label="Diagram preview">
      <div class="lightbox-bar">
        <span class="lightbox-title" id="lightbox-title">Diagram</span>
        <div class="lightbox-controls">
          <div class="lightbox-zoom-group" id="lightbox-zoom-controls">
            <button type="button" class="icon-btn sm" id="lightbox-zoom-out" aria-label="Zoom out" title="Zoom out (-)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
            </button>
            <button type="button" class="lightbox-zoom-pct" id="lightbox-zoom-reset" aria-label="Reset zoom" title="Reset zoom and pan (0)">100%</button>
            <button type="button" class="icon-btn sm" id="lightbox-zoom-in" aria-label="Zoom in" title="Zoom in (+)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>
          <button type="button" class="icon-btn sm" id="lightbox-close" aria-label="Close diagram preview" title="Close (Esc)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
      </div>
      <div class="lightbox-body" id="lightbox-body">
        <div class="lightbox-stage" id="lightbox-stage"></div>
      </div>
    </div>
  </div>

  <!-- sign in -->
  <div class="modal center" id="signin-modal" hidden>
    <form class="dialog" id="signin-form" role="dialog" aria-modal="true" aria-labelledby="signin-title">
      <h2 id="signin-title">Sign in to review</h2>
      <p class="muted">Review mode shows margin comments on each page, where each sentence comes from, and lets you edit the text.</p>
      <label>Your name
        <input id="signin-name" type="text" maxlength="60" autocomplete="name" placeholder="Recorded with your changes" required>
      </label>
      <label>Review password
        <input id="signin-password" type="password" autocomplete="current-password" required>
      </label>
      <p class="form-error" id="signin-error" hidden></p>
      <div class="dialog-actions">
        <button type="button" class="btn" id="signin-cancel">Cancel</button>
        <button type="submit" class="btn primary" id="signin-submit">Sign in</button>
      </div>
    </form>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/diff@7.0.0/dist/diff.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
